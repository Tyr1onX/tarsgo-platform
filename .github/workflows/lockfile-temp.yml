name: Generate lockfile temp

on:
  push:
    branches:
      - codex/v0.1-hardening

permissions:
  contents: write

jobs:
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate package-lock
        run: |
          cd frontend
          npm install --package-lock-only --ignore-scripts
      - name: Commit package-lock
        run: |
          if git diff --quiet -- frontend/package-lock.json && git ls-files --error-unmatch frontend/package-lock.json >/dev/null 2>&1; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/package-lock.json
          git commit -m "chore: lock frontend dependencies"
          git push
